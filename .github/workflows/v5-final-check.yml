name: V5 final Groq accuracy check (bounded)
on:
  push:
    branches: [main]
    paths: [".github/workflows/v5-final-check.yml"]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check Groq key without printing it
        run: test -n "$GROQ_API_KEY"
      - name: Fetch exact arXiv versions
        run: python relay.py fetch
      - name: Run full-PDF hosted evaluation, 18 paced calls maximum
        run: |
          python relay.py real-probe --count 18 --gap 5.5 --setting balanced
          cp artifacts/real_results.csv artifacts/v5_real_results.csv
          cp artifacts/real_traces.json artifacts/v5_real_traces.json
          cp artifacts/real_headers.json artifacts/v5_real_headers.json
          python - <<'PY'
          import csv,collections,json
          rows=list(csv.DictReader(open('artifacts/v5_real_results.csv')))
          print('V5_REAL_RESULTS='+json.dumps({'n':len(rows),'status':dict(collections.Counter(r['status'] for r in rows)),'grades':dict(collections.Counter(r['answer_grade'] for r in rows))}))
          PY
      - name: Store raw evidence separately from older runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v5-real-evidence-${{ github.run_number }}
          path: |
            artifacts/v5_real_results.csv
            artifacts/v5_real_traces.json
            artifacts/v5_real_headers.json
            data/papers/manifest.json
          if-no-files-found: warn
          retention-days: 21
