name: Optimized full-PDF retrieval benchmark
on:
  push:
    branches: [main]
    paths:
      - "retrieval_optimized.py"
      - "relay.py"
      - "tests/test_retrieval_optimized.py"
      - ".github/workflows/optimized-retrieval.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run fast regression suite
        run: python -m pytest -q
      - name: Fetch and hash exact arXiv versions
        run: python relay.py fetch
      - name: Run improved deterministic full-PDF quality benchmark
        run: |
          python relay.py quality
          cp artifacts/quality_results.csv artifacts/v4_fullpdf_quality_results.csv
          cp artifacts/quality_answers.json artifacts/v4_fullpdf_quality_answers.json
          python - <<'PY'
          import csv,collections,json
          rows=list(csv.DictReader(open("artifacts/v4_fullpdf_quality_results.csv",newline="")))
          stats={s:dict(collections.Counter(r["answer_grade"] for r in rows if r["retrieval_setting"]==s)) for s in ["small","balanced","wide"]}
          print("OPTIMIZED_FULL_PDF_GRADES="+json.dumps(stats,sort_keys=True))
          assert len(rows)==54, "Incomplete evaluation"
          PY
      - name: Upload separately versioned V4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-fullpdf-evidence-${{ github.run_number }}
          path: |
            artifacts/v4_fullpdf_quality_results.csv
            artifacts/v4_fullpdf_quality_answers.json
            data/papers/manifest.json
          if-no-files-found: warn
          retention-days: 21
