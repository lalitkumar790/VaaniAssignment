name: Groq measurements (manual, secret-safe)
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq model id; verify availability on your free account"
        required: true
        default: "openai/gpt-oss-20b"
        type: string
      requests:
        description: "Maximum sequential real requests (stops on rate limit)"
        type: choice
        options:
          - "8"
          - "18"
          - "24"
        default: "18"
permissions:
  contents: read
jobs:
  real-probe:
    name: Full-PDF evaluation and hosted Groq probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ inputs.model }}
      REQUEST_COUNT: ${{ inputs.requests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check Groq secret exists without printing it
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add GROQ_API_KEY at Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: Fetch the three exact arXiv versions and checksums
        run: python relay.py fetch
      - name: Evaluate the full PDFs across three retrieval settings
        run: python relay.py quality
      - name: Probe hosted Groq serially without bypassing quotas
        run: python relay.py real-probe --count "$REQUEST_COUNT"
      - name: Upload raw evidence (no key or downloaded PDFs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-measurements-${{ github.run_number }}
          path: |
            artifacts/real_results.csv
            artifacts/real_traces.json
            artifacts/real_headers.json
            artifacts/quality_results.csv
            artifacts/quality_answers.json
            data/papers/manifest.json
          if-no-files-found: warn
          retention-days: 14
