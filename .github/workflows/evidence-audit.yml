name: Verify and publish V5 HTTP evidence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-audit.yml"
      - "audit_evidence.py"
      - "render_evidence_pdf.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify all tests including historical HTTP/local distinction
        run: python -m pytest -q
      - name: Audit original V5 Groq headers against request records
        run: python audit_evidence.py
      - name: Regenerate the required two-page report
        run: python render_evidence_pdf.py
      - name: Assert reproducible evidence and PDF shape
        run: |
          python - <<'PY'
          import json, fitz, csv
          d=json.load(open("artifacts/v5_provider_audit.json"))
          assert d["hosted_http_requests"]==16 and d["local_no_http_requests"]==2
          assert len(list(csv.DictReader(open("results.csv",newline=""))))==519
          assert len(fitz.open("REPORT.pdf"))==2
          print("Verified 16 HTTP calls, 2 local refusals, 519 raw rows, two PDF pages")
          PY
      - name: Commit generated audit evidence and corrected report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/v5_provider_audit.json artifacts/v5_question_review.csv REPORT.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish V5 true HTTP call audit and corrected two-page report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive audit artifacts for the reviewer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v5-http-provenance-audit
          path: |
            REPORT.pdf
            artifacts/v5_provider_audit.json
            artifacts/v5_question_review.csv
          retention-days: 20
