name: V4 real Groq comparison (single bounded run)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v4-real-comparison.yml"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure the applicant's secret is installed
        shell: bash
        run: |
          test -n "$GROQ_API_KEY" || { echo "::error::Missing GROQ_API_KEY"; exit 1; }
      - name: Pin and fetch exact paper versions
        run: python relay.py fetch
      - name: Run 18 paced, serial real-model calls; stop at first rate-limit
        run: |
          python relay.py real-probe --count 18 --gap 5.5 --setting balanced
          cp artifacts/real_results.csv artifacts/v4_hosted_results.csv
          cp artifacts/real_traces.json artifacts/v4_hosted_traces.json
          cp artifacts/real_headers.json artifacts/v4_hosted_headers.json
          python - <<'PY'
          import csv,collections,json
          rows=list(csv.DictReader(open("artifacts/v4_hosted_results.csv",newline="")))
          print("V4_HOSTED="+json.dumps({"requests":len(rows),"status":dict(collections.Counter(r["status"] for r in rows)),"grades":dict(collections.Counter(r["answer_grade"] for r in rows))}))
          assert len(rows)>0
          PY
      - name: Retain raw evidence without key
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-groq-evidence-${{ github.run_number }}
          path: |
            artifacts/v4_hosted_results.csv
            artifacts/v4_hosted_traces.json
            artifacts/v4_hosted_headers.json
            data/papers/manifest.json
          if-no-files-found: warn
          retention-days: 21
