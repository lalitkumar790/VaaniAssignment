name: Expand uploaded assignment bundle
on:
  push:
    paths:
      - submission_bundle.zip
      - .github/workflows/unpack.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand complete measured prototype
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('submission_bundle.zip') as z:
              for name in z.namelist():
                  target = Path(name)
                  if target.is_absolute() or '..' in target.parts:
                      raise RuntimeError('Refusing unsafe zip member')
              z.extractall('.')
          PY
      - name: Commit working sources and raw evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay.py build_report.py requirements.txt .gitignore .github/workflows/ci.yml data/ tests/ REPORT.md REPORT.pdf results.csv artifacts/ conversation_history.md
          git diff --cached --quiet || (git commit -m "Expand Relay working sources, tests, 144 local observations and two-page report" && git push)
