name: CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate interactive dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          js=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/relay-ui.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/relay-ui.js
      - name: Smoke test (explicit demo notes, no remote requests)
        run: python relay.py ask --demo 'What is the theoretical latency of Moshi?'
