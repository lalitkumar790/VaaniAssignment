name: Assemble and publish final V1-V5 submission
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-final.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Download pinned V4 full-PDF stand-in experiment
        run: gh run download 42969980873 --repo lalitkumar790/VaaniAssignment --name v4-fullpdf-evidence-4 --dir _downloaded/v4
      - name: Download pinned V5 real Groq experiment
        run: gh run download 42970031360 --repo lalitkumar790/VaaniAssignment --name v5-real-evidence-1 --dir _downloaded/v5
      - name: Merge raw request data and check provenance
        run: python assemble_final_evidence.py
      - name: Render exactly two page PDF from merged rows
        run: python render_evidence_pdf.py
      - name: Validate PDF and dataset
        run: |
          python - <<'PY'
          import csv,fitz,json
          rows=list(csv.DictReader(open('results.csv',newline='')))
          assert len(rows)==519
          assert len({r['request_id'] for r in rows})==519
          assert len(fitz.open('REPORT.pdf'))==2
          m=json.load(open('artifacts/final_merge_summary.json'))
          assert m['v5_status']=={'ok':18}
          print('Final evidence validated:',len(rows),'request rows, two PDF pages')
          PY
      - name: Publish reproducible PDF and CSV together
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv REPORT.pdf artifacts/v4_fullpdf_quality_results.csv artifacts/v4_fullpdf_quality_answers.json artifacts/v5_real_results.csv artifacts/v5_real_traces.json artifacts/v5_real_headers.json artifacts/final_merge_summary.json data/papers/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish 519-row final request evidence and versioned V5 two-page report"
            git push origin HEAD:main
          fi
