name: Final two-page report from raw results
on:
  push:
    branches: [main]
    paths: [validation/render_pdf_v3.txt]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Produce and verify two-page report from all results.csv rows
        run: python render_evidence_pdf.py
      - name: Publish updated REPORT.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild two-page V3 report from 447 source observations"
            git push origin HEAD:main
          fi
      - name: Upload snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-v3-two-page-report
          path: REPORT.pdf
          retention-days: 30
